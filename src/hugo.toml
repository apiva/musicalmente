baseURL = "https://apiva.github.io/musicalmente/"
defaultContentLanguage = "it"
timeZone = "Europe/Rome"
title = "Musicalmente Latina"
publishDir = "../docs"
enableRobotsTXT = true
# "Novità" -> /category/novita/
removePathAccents = true
disableKinds = ["rss"]

[taxonomies]
category = "categories"

[permalinks.page]
blog = "/:year/:month/:day/:slug/"

[permalinks.term]
categories = "/category/:slug/"

[markup.goldmark.renderer]
# Required so shortcodes can wrap Markdown in HTML containers.
unsafe = true

[markup.goldmark.parser.attribute]
block = true

[imaging]
resampleFilter = "Lanczos"
[imaging.webp]
quality = 80
[imaging.jpeg]
quality = 82

[outputs]
home = ["html"]
section = ["html"]
taxonomy = ["html"]
term = ["html"]

[sitemap]
changeFreq = "monthly"

[languages.it]
locale = "it-IT"
label = "Italiano"

# ---------------------------------------------------------------------------
# School details, used by header, footer, contact page and shortcodes.
# ---------------------------------------------------------------------------
[params]
description = "Musicalmente Latina, la scuola di musica a Latina: corsi di canto, pianoforte, chitarra, batteria, basso, violino e molto altro per bambini, ragazzi e adulti."
legalName = "Musicalmente APS"
address = "Largo Cesti piano I, int 24 04100 Latina"
phone = "351 389 0201"
# Number in international format, used for tel: and WhatsApp links.
phoneIntl = "393513890201"
hours = ["Lunedì – Venerdì: 9:30 – 20:00", "Sabato: 9:30 – 13:00"]
recognition = "Scuola di Musica riconosciuta dalla **Regione Lazio** con **determinazione n. G15663**,"
copyright = "© 2025 Musicalmente Latina"
enrollURL = "https://musicalmente.mooking.it/iscrizione.html"
facebook = "https://www.facebook.com/musicalmentelatina"
instagram = "https://www.instagram.com/musicalmentelatina/"
cosmoURL = "https://www.cosmomusica.org/"
mapQuery = "Largo Cesti piano I, int 24 04100 Latina"

# Contact form. With no `action`, the form composes a WhatsApp message to
# `phoneIntl`. Set `action` to a form-handling endpoint (e.g. Formspree) to
# have the form POST there instead.
[params.contactForm]
action = ""

